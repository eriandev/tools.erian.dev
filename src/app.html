<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />

    %sveltekit.head%

    <style>
      @font-face {
        font-weight: 400;
        font-family: 'Ubuntu';
        font-style: normal;
        font-display: swap;
        src: url('/fonts/ubuntu-400.woff2') format('woff2');
      }

      @font-face {
        font-weight: 500;
        font-family: 'Ubuntu';
        font-style: normal;
        font-display: swap;
        src: url('/fonts/ubuntu-500.woff2') format('woff2');
      }
    </style>
  </head>

  <body class="min-h-screen" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
